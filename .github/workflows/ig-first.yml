name: ig-first

# One-off (Nov 27 2026, 13:35 IST = 08:05 UTC, just after the Gemini daily reset at 13:30 IST): run the
# auto-produce check right away so the first produce after the reset is Instagram-only (3-4 reels) while
# Instagram stock is under 3. It does nothing if Instagram stock is fine or a produce run is already going.
# Independent of the box. The date guard makes it a no-op on any other day; delete this file afterwards.
on:
  schedule:
    - cron: "5 8 27 11 *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  ig-first:
    if: >-
      github.repository == 'Bhupi820970/pro-edit' &&
      ((github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
       github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write    # read the DRAFT stock release (no pushes)
      actions: write     # dispatch produce.yml
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
      VICE_PIPELINE_HOME: /tmp/vice-ph
    steps:
      - name: Date guard (Nov 27 2026 only, unless started by hand)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%F)" = "2026-11-27" ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "not 2026-11-27 -> nothing to do"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.guard.outputs.go == '1'
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.guard.outputs.go == '1'
        with: {python-version: "3.12"}
      - name: Instagram-first auto-produce
        if: steps.guard.outputs.go == '1'
        timeout-minutes: 3
        run: python -m pipeline_lib.autoproduce check --dispatch
