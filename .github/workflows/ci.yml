name: ci

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "config/**"
      - "ledger/**"
      - ".github/workflows/**"
      - "tests/**"
      - "requirements.txt"
  workflow_dispatch: {}

# No pull_request / pull_request_target. Fork PRs do not get secrets (none used here).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}

      - name: Python deps (light)
        run: pip install -q pytest numpy pillow

      - name: Compile all python
        run: python3 -m py_compile pipeline.py vicestyle.py box_fetch.py fanedit_stark.py caption_patterns.py scripts/upload.py pipeline_lib/*.py pipeline_lib/publish/*.py

      - name: Unit tests (publish + stdlib suites)
        run: python3 -m pytest -q tests/test_publish_upload.py tests/test_publish_captions.py tests/test_cleanup.py tests/test_queue_trust.py tests/test_titles.py tests/test_ytdlp_cookies.py

      - name: actionlint
        env:
          ACTIONLINT_VER: "1.7.7"
          ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          curl -sSfL -o /tmp/actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VER}/actionlint_${ACTIONLINT_VER}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color
