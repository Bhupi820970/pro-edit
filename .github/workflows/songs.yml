name: song-stock

# Keep ~30 official songs per video genre in the draft release "songs".
# A genre at or below stock.refill_at (config/songs.json) is refilled from curated seeds + Gemini picks,
# each Gemini-vetted for the genre vibe. CI fetch order: SoundCloud, YouTube frontends (Piped/Invidious
# + yt-dlp player clients), Internet Archive, Pixabay Music last. Triggers: schedule + workflow_dispatch
# only (no PR triggers).
on:
  schedule:
    - cron: "15 21 * * *"   # IST 02:45 daily
  workflow_dispatch:
    inputs:
      dry_run: {description: "true = only log what would be fetched", default: "false", required: false}

permissions: {}

jobs:
  refill:
    if: >-
      github.repository == 'Bhupi820970/pro-edit' &&
      ((github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
       (github.event_name == 'schedule' && vars.SCHEDULE_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write   # upload to the draft release "songs"
    concurrency: {group: song-stock, cancel-in-progress: false}
    env:
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
      GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
      GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
      GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
      GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
      OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
      OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      GEMINI_API_KEY_12: ${{ secrets.GEMINI_API_KEY_12 }}
      GEMINI_API_KEY_13: ${{ secrets.GEMINI_API_KEY_13 }}
      GH_TOKEN: ${{ github.token }}
      VICE_PIPELINE_HOME: /tmp/vice-ph
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - name: Deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -U "yt-dlp[default]" bgutil-ytdlp-pot-provider
      - name: PO-token server for YouTube bot checks (best effort)
        continue-on-error: true
        run: docker run -d --name bgutil -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
      - name: Refill genre song stock
        env:
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          FLAGS=()
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && FLAGS+=(--to-target)
          if [ "$DRY" = "true" ]; then python -m pipeline_lib.song_stock refill --dry-run "${FLAGS[@]}";
          else python -m pipeline_lib.song_stock refill "${FLAGS[@]}"; fi
