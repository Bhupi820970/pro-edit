name: dedupe-1830

# One-shot owner-only cleanup of the 2026-11-26 18:30 IST double upload.
# No schedule, no pull_request / pull_request_target. Secrets are never logged.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Must be DELETE_GETLUCKY_DUP_GoCHmaSRViw"
        type: string
        required: true
      apply:
        description: "If true, delete the allowlisted duplicate(s). If false, list only."
        type: boolean
        default: false

permissions: {}

jobs:
  dedupe:
    if: >-
      github.repository == 'Bhupi820970/pro-edit' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner &&
      github.event.inputs.confirm == 'DELETE_GETLUCKY_DUP_GoCHmaSRViw'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      PYTHONUNBUFFERED: "1"
      DEDUPE_APPLY: ${{ github.event.inputs.apply == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}

      - name: List and optionally delete the 18:30 duplicate
        run: python scripts/dedupe_1830.py
