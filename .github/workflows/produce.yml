name: produce-videos
run-name: ${{ github.event.inputs.auto == 'true' && 'produce (auto buffer refill)' || format('produce-videos ({0})', github.event_name) }}

on:
  schedule:
    # IST 05:30, 11:30, 17:30, 23:30 — keep 7 ready videos per platform (buffer top-up)
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      platform: {description: "youtube | instagram | both", default: "both", required: true}
      mode: {description: "ensure (top up buffer to target) | produce (exactly count)", default: "ensure", required: true}
      count: {description: "videos per platform for mode=produce", default: "1", required: false}
      category: {description: "force a category for every platform (gta, gaming, movie, series, sports, romance) or empty", default: "", required: false}
      youtube_category: {description: "optional category override for the youtube job only", default: "", required: false}
      instagram_category: {description: "optional category override for the instagram job only", default: "", required: false}
      max_minutes: {description: "time budget per platform job (Produce step cap 75 min, job cap 100 min)", default: "60", required: false}
      auto: {description: "set by the watchdog: buffer refill, count per platform from current stock", default: "false", required: false}
      ignore_quota_gate: {description: "manual runs only: try anyway while Gemini is out on every key (cached vets + queue/manual_picks.json)", default: "false", required: false}
      release_tag: {description: "TEST runs: draft release tag for the mp4s (e.g. test-renders); empty = vc-ready (production stock). The upload workflow, not this one, posts to YouTube/Instagram.", default: "", required: false}

# Triggers are schedule + workflow_dispatch only (no pull_request / pull_request_target), so code from
# forks or PRs never runs with these secrets. Fork PRs cannot receive repository secrets.
permissions: {}

# auto refills share one group, so two auto-produce runs never stack (manual / scheduled runs are unaffected)
concurrency:
  group: ${{ github.event.inputs.auto == 'true' && 'produce-auto' || format('produce-run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  plan:
    # never on forks; manual runs only by the owner; scheduled runs only when SCHEDULE_ENABLED=true
    if: >-
      github.repository == 'Bhupi820970/pro-edit' &&
      ((github.event_name == 'workflow_dispatch' &&
        (github.actor == github.repository_owner || github.actor == 'github-actions[bot]')) ||
       (github.event_name == 'schedule' && vars.SCHEDULE_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read    # read {platform}/gemini_quota.json on branch pipeline-state
    outputs:
      platforms: ${{ steps.p.outputs.platforms }}
      blocked: ${{ steps.gate.outputs.blocked }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Fail fast: every Gemini key AND backup model out of quota -> no produce job at all (the run ends in
      # about a minute with a notice; the watchdog waits for the ~13:30 IST reset). No Gemini call is made;
      # the keys are only checked for presence (same list as the produce job below).
      - id: gate
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
          OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI_API_KEY_12 }}
          GEMINI_API_KEY_13: ${{ secrets.GEMINI_API_KEY_13 }}
          IGNORE_GATE: ${{ github.event.inputs.ignore_quota_gate }}
        run: |
          if [ "$IGNORE_GATE" = "true" ]; then echo "quota gate skipped (manual override)"; echo "blocked=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 -m pipeline_lib.quota_gate check || echo "blocked=false" >> "$GITHUB_OUTPUT"
      - id: p
        run: |
          P="${{ github.event.inputs.platform || 'both' }}"
          case "$P" in
            youtube|instagram) echo "platforms=[\"$P\"]" >> "$GITHUB_OUTPUT" ;;
            both) echo 'platforms=["instagram","youtube"]' >> "$GITHUB_OUTPUT" ;;   # Instagram first (priority)
            *) echo "invalid platform: $P" >&2; exit 1 ;;
          esac

  produce:
    needs: plan
    if: needs.plan.outputs.blocked != 'true'
    runs-on: ubuntu-latest
    # hard caps: setup ~15 min + Produce step 75 min (max_minutes 60, no attempt starts without 25 min left)
    timeout-minutes: 100
    permissions:
      contents: write   # draft releases + pipeline-state branch
      actions: write    # upload artifacts
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.plan.outputs.platforms) }}
    concurrency:
      # per-category group so parallel per-genre test dispatches don't cancel each other's pending runs
      group: produce-${{ matrix.platform }}-${{ github.event.inputs.category || 'auto' }}
      cancel-in-progress: false
    env:
      VICE_PIPELINE_HOME: /mnt/ph/${{ matrix.platform }}
      VICESTYLE_CACHE: /mnt/ph/${{ matrix.platform }}/vcache
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
      GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
      GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
      GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
      GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
      OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
      OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      GEMINI_API_KEY_12: ${{ secrets.GEMINI_API_KEY_12 }}
      GEMINI_API_KEY_13: ${{ secrets.GEMINI_API_KEY_13 }}
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
      # after this many YouTube bot checks the runner stops downloading and uses only box clips
      VICE_RUNNER_BOT_LIMIT: "4"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Disk + system deps
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo mkdir -p /mnt/ph && sudo chown -R "$USER" /mnt/ph
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg tesseract-ocr tesseract-ocr-eng > /dev/null
          df -h / /mnt | cat

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12", cache: pip}

      - name: Python deps (+ latest yt-dlp, PO-token provider plugin)
        run: |
          pip install -q -r requirements.txt
          pip install -q -U "yt-dlp[default]" bgutil-ytdlp-pot-provider
          yt-dlp --version

      - name: PO-token server for YouTube bot checks (best effort)
        continue-on-error: true
        run: |
          docker run -d --name bgutil -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
          sleep 5; curl -s -m 5 http://127.0.0.1:4416/ping || true

      - name: Fonts (OFL, Google Fonts)
        run: |
          mkdir -p fonts
          curl -sSfL -o fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf

      - name: Restore caches (whisper model, transcripts, songs, sources)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/huggingface
            models
            /mnt/ph/${{ matrix.platform }}/vcache
            /mnt/ph/${{ matrix.platform }}/songs
          key: ph-${{ matrix.platform }}-${{ github.run_id }}
          restore-keys: ph-${{ matrix.platform }}-

      - name: Restore pipeline state (branch pipeline-state)
        timeout-minutes: 20
        run: |
          retry() { for i in 1 2 3; do "$@" && return 0; sleep $((4 * i * i)); done; return 1; }
          mkdir -p "$VICE_PIPELINE_HOME"
          if git ls-remote --exit-code --heads "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pipeline-state > /dev/null; then
            git fetch -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pipeline-state
            git show "FETCH_HEAD:${{ matrix.platform }}/state.json" > "$VICE_PIPELINE_HOME/state.json" 2>/dev/null || rm -f "$VICE_PIPELINE_HOME/state.json"
            # per key+model Gemini cool-downs / invalid keys (labels + timestamps only, no keys)
            git show "FETCH_HEAD:${{ matrix.platform }}/gemini_quota.json" > "$VICE_PIPELINE_HOME/gemini_quota.json" 2>/dev/null || rm -f "$VICE_PIPELINE_HOME/gemini_quota.json"
            # manual picks (plain JSON data, used only while Gemini is out of quota; see queue/needs_manual_pick.json)
            mkdir -p "$VICE_PIPELINE_HOME/queue"
            git show "FETCH_HEAD:queue/manual_picks.json" > "$VICE_PIPELINE_HOME/queue/manual_picks.json" 2>/dev/null || rm -f "$VICE_PIPELINE_HOME/queue/manual_picks.json"
          fi
          # clips the box fetched (box/fetch_sources.sh cron -> box_fetch.py -> DRAFT release "sources").
          # These are used FIRST; runner YouTube downloads are only a fallback. Gemini still vets each one.
          mkdir -p "$VICE_PIPELINE_HOME/sources"
          # Selective pull (pool is ~40 clips per category): Gemini-rejected clips are never pulled,
          # accepted first, then newest unvetted, up to 20 GB.
          retry gh release download sources --pattern manifest.json --dir "$VICE_PIPELINE_HOME/sources" --clobber 2>/dev/null || true
          timeout 600 python pipeline.py pull-sources --max-gb 20 || true
          retry gh release download sources --pattern box_heartbeat.json --dir "$VICE_PIPELINE_HOME/sources" --clobber 2>/dev/null || true
          find "$VICE_PIPELINE_HOME/sources" -maxdepth 1 -printf "%f\n" | head -30
          # official audio the box fetched (box_fetch.py -> DRAFT release "songs"); runner uses these first
          mkdir -p "$VICE_PIPELINE_HOME/songs"
          retry gh release download songs --dir "$VICE_PIPELINE_HOME/songs" --skip-existing 2>/dev/null || true
          retry gh release download songs --pattern manifest.json --dir "$VICE_PIPELINE_HOME/songs" --clobber 2>/dev/null || true
          find "$VICE_PIPELINE_HOME/songs" -maxdepth 1 -printf "%f\n" | head -40

      - name: Produce
        timeout-minutes: 75
        env:
          # production stock only: each video goes to vc-ready as soon as it passes QA (test runs wait for the end)
          VICE_ATTACH_EACH_TAG: ${{ github.event.inputs.release_tag == '' && 'vc-ready' || '' }}
          VICE_IGNORE_QUOTA_GATE: ${{ github.event.inputs.ignore_quota_gate || 'false' }}
        run: |
          MODE="${{ github.event.inputs.mode || 'ensure' }}"
          COUNT="${{ github.event.inputs.count || '1' }}"
          if [ "${{ github.event.inputs.auto }}" = "true" ]; then
            # buffer refill: 3-4 videos, Instagram the bigger batch; 0 = this platform is already full
            COUNT="$(python -m pipeline_lib.autoproduce count --platform "${{ matrix.platform }}" || echo 3)"
            echo "auto refill: $COUNT video(s) for ${{ matrix.platform }}"
            if [ "$COUNT" = "0" ]; then exit 0; fi
          fi
          CAT="${{ github.event.inputs.category }}"
          YCAT="${{ github.event.inputs.youtube_category }}"
          ICAT="${{ github.event.inputs.instagram_category }}"
          if [ "${{ matrix.platform }}" = "youtube" ] && [ -n "$YCAT" ]; then CAT="$YCAT"; fi
          if [ "${{ matrix.platform }}" = "instagram" ] && [ -n "$ICAT" ]; then CAT="$ICAT"; fi
          ARGS=(--platform "${{ matrix.platform }}" --max-minutes "${{ github.event.inputs.max_minutes || '60' }}")
          [ -n "$CAT" ] && ARGS+=(--category "$CAT")
          if [ "$MODE" = "produce" ]; then python pipeline.py produce "${ARGS[@]}" --count "$COUNT";
          else python pipeline.py ensure "${ARGS[@]}"; fi

      - name: Add songs this run fetched (Gemini requests) to the genre song stock
        if: always()
        continue-on-error: true
        run: python -m pipeline_lib.song_stock publish

      - name: Share accepted clips to the source pool (draft release "sources")
        if: always()
        continue-on-error: true
        run: python pipeline.py pool-sync

      - name: Upload ready videos to draft release
        if: always()
        env:
          REL_TAG: ${{ github.event.inputs.release_tag }}
        run: python pipeline.py attach-release --tag "${REL_TAG:-vc-ready}"

      - name: Ready videos, previews + logs as artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.platform }}-ready-${{ github.run_id }}
          path: |
            /mnt/ph/${{ matrix.platform }}/ready/${{ matrix.platform }}/*.mp4
            /mnt/ph/${{ matrix.platform }}/ready/${{ matrix.platform }}/*.json
            /mnt/ph/${{ matrix.platform }}/prev/*.mp4
            /mnt/ph/${{ matrix.platform }}/logs/
            /mnt/ph/${{ matrix.platform }}/status.json
          retention-days: 7
          if-no-files-found: warn

      - name: Save state + status to branch pipeline-state
        if: always()
        run: |
          set -e
          P=${{ matrix.platform }}
          git config user.name "vice-pipeline-bot"; git config user.email "actions@users.noreply.github.com"
          rm -rf /tmp/st && mkdir /tmp/st && cd /tmp/st
          git init -q && git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for i in 1 2 3 4 5; do
            if git fetch -q origin pipeline-state 2>/dev/null; then git checkout -q -B pipeline-state origin/pipeline-state; else git checkout -q --orphan pipeline-state; fi
            mkdir -p "$P/logs"
            cp "$VICE_PIPELINE_HOME/state.json" "$P/" 2>/dev/null || true
            cp "$VICE_PIPELINE_HOME/status.json" "$P/" 2>/dev/null || true
            cp "$VICE_PIPELINE_HOME/fetch_queue.json" "$P/" 2>/dev/null || true
            cp "$VICE_PIPELINE_HOME/gemini_quota.json" "$P/" 2>/dev/null || true
            if [ -f "$VICE_PIPELINE_HOME/queue/needs_manual_pick.json" ]; then
              mkdir -p queue
              python "$GITHUB_WORKSPACE/pipeline.py" merge-manual-pick --inputs "$VICE_PIPELINE_HOME/queue/needs_manual_pick.json" --out queue/needs_manual_pick.json || true
            fi
            cp "$VICE_PIPELINE_HOME"/logs/*.json "$VICE_PIPELINE_HOME"/logs/*.log "$P/logs/" 2>/dev/null || true
            python "$GITHUB_WORKSPACE/pipeline.py" merge-status --inputs youtube/status.json instagram/status.json --out status.json || true
            git add -A && git -c user.name=vice-pipeline-bot -c user.email=actions@users.noreply.github.com commit -qm "state: $P run ${{ github.run_id }}" || true
            git push -q origin pipeline-state && break
            sleep $((i * 7))
          done

