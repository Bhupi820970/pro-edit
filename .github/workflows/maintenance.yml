name: maintenance

# Owner-only, manual. list = show recent live posts (ids + titles, no secrets) next to the ledger.
# delete-duplicate = remove ONE duplicate post after guards: never an id in the ledger, never a protected
# original, title/caption must match, and the original copy must still be live.
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [list, delete-duplicate]
        default: list
      platform:
        type: choice
        options: [youtube, instagram]
        default: youtube
      media_id: {description: "duplicate YouTube video id / IG media id", default: "", required: false}
      must_contain: {description: "text the duplicate's title/caption must contain", default: "", required: false}

permissions: {}

concurrency:
  group: vice-upload        # never runs while an upload is posting
  cancel-in-progress: false

jobs:
  maint:
    if: github.repository == 'Bhupi820970/pro-edit' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - name: Run
        env:
          ACTION: ${{ github.event.inputs.action }}
          PLATFORM: ${{ github.event.inputs.platform }}
          MEDIA_ID: ${{ github.event.inputs.media_id }}
          MUST: ${{ github.event.inputs.must_contain }}
        run: |
          if [ "$ACTION" = "list" ]; then python -m pipeline_lib.publish.live_check list
          else python -m pipeline_lib.publish.live_check delete --platform "$PLATFORM" --id "$MEDIA_ID" --must-contain "$MUST"; fi
