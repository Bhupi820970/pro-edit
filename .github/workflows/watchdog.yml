name: watchdog

# Every 30 min (and on a box kick): backup stock 20 per platform, refill (3-4/run) when under 8 (auto-produce), alert at <=2; and
# keep ONE health issue (label `health`) open only while something is wrong. Silent when all is fine.
# Reads only GitHub/YouTube/IG APIs; never reads issue text. Secret values are never printed.
on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      gemini_check:
        description: "also list Gemini models and test each tier once (names + HTTP codes only)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watch:
    if: >-
      github.repository == 'Bhupi820970/pro-edit' &&
      ((github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
       (github.event_name == 'schedule' && vars.SCHEDULE_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write    # read the DRAFT stock release (drafts are invisible to a read-only token); no pushes
      actions: write     # dispatch produce.yml
      issues: write      # the single health issue
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
      VICE_PIPELINE_HOME: /tmp/vice-ph
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      # outcome of the box's weekly IG token refresh (box/ig_token_refresh.sh); a status line, no secret
      IG_TOKEN_REFRESH: ${{ vars.IG_TOKEN_REFRESH }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - name: Auto-produce (stock under 8, toward 20)
        continue-on-error: true
        timeout-minutes: 3
        run: python -m pipeline_lib.autoproduce check --dispatch
      - name: Health issue (open / update / close)
        continue-on-error: true
        timeout-minutes: 3
        run: python -m pipeline_lib.health check --apply
      - name: Gemini models (manual)
        if: github.event.inputs.gemini_check == 'true'
        timeout-minutes: 3
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
          OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI_API_KEY_12 }}
          GEMINI_API_KEY_13: ${{ secrets.GEMINI_API_KEY_13 }}
        run: python -m pipeline_lib.gemini check
