name: ig-token

# Instagram token check / refresh without app secrets. Dispatched only by the owner (the box's weekly cron
# box/ig_token_refresh.sh uses the owner's gh login). The token is never printed: a refreshed token leaves
# this job only as an encrypted 1-day artifact that just the box can decrypt (config/ig_handoff_pub.pem).
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [check, refresh]
        default: check

permissions: {}

concurrency:
  group: ig-token
  cancel-in-progress: false

jobs:
  token:
    if: github.repository == 'Bhupi820970/pro-edit' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      PYTHONUNBUFFERED: "1"
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - name: Install cryptography (pinned)
        timeout-minutes: 3
        run: python -m pip install --quiet "cryptography==43.0.3"
      - name: Token ${{ github.event.inputs.mode }}
        timeout-minutes: 3
        run: python -m pipeline_lib.ig_token "${{ github.event.inputs.mode }}" --out "$RUNNER_TEMP/ig_handoff.bin"
      - name: Encrypted handoff (box only)
        if: github.event.inputs.mode == 'refresh' && hashFiles(format('{0}/ig_handoff.bin', runner.temp)) != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ig-handoff
          path: ${{ runner.temp }}/ig_handoff.bin
          retention-days: 1
          if-no-files-found: ignore
